<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Dulce Encanto{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8f2;
            color: #49352e;
        }

        header {
            background-color: #8b4b45;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background-color: #f2d5c4;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: #49352e;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 15px;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        .tarjeta {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px #00000015;
            padding-bottom: 15px;
        }

        .tarjeta img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .contenido {
            padding: 15px;
        }

        .precio {
            color: #a44c43;
            font-size: 20px;
            font-weight: bold;
        }

        button, .boton {
            background-color: #8b4b45;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #f2d5c4;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Dulce Encanto</h1>
        <p>Pastelería artesanal</p>
    </header>

    <nav>
        <a href="{% url 'catalogo' %}">Inicio | Catálogo</a>
    </nav>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>

    <footer>
        <p>© 2026 Dulce Encanto - Todos los derechos reservados</p>
    </footer>

</body>
</html>
